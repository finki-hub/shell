name: Update contracts

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test conservative image updater contracts
        run: timeout 180s python3 -m unittest scripts.tests.test_update_pins
