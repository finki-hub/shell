name: Linters (Web)

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# `web` is an npm workspace: the lockfile and node_modules live at the repository
# root, so both jobs run from there and reach the workspace through the root
# scripts (`lint` -> eslint, `check` -> tsc --noEmit), exactly as web/Dockerfile
# reaches it with `npm run build --workspace web`.
jobs:
  eslint:
    uses: finki-hub/.github/.github/workflows/eslint.yaml@main
    with:
      working-directory: .
      script: lint
    secrets: inherit

  tsc:
    uses: finki-hub/.github/.github/workflows/tsc.yaml@main
    with:
      working-directory: .
      script: check
    secrets: inherit
