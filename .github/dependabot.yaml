version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: uv
    directories:
      - /hub
      - /lab/extension
    schedule:
      interval: daily

  - package-ecosystem: docker
    directories:
      - /hub
      - /lab
      - /web
    schedule:
      interval: daily
    ignore:
      # The Hub runtime is locked to Python 3.14 until the projects are re-locked
      # for 3.15 and all dependencies publish wheel-only installs. A version
      # range also covers security updates, which update-types does not filter.
      - dependency-name: python
        versions: [">= 3.15"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
