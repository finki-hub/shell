[project]
name = "shell-hub"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "docker==7.2.0",
    "dockerspawner==14.0.0",
    "httpx>=0.28.1",
    "jupyterhub==6.0.1",
    "jupyterhub-idle-culler>=2.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.13.0",
    "requests>=2.32.5",
    "tzdata>=2026.3",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shell_hub"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-docker>=7.2.0.20260923",
]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["shell_hub", "shell_hub.*", "jupyterhub_config"]
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
strict_equality_for_none = true
warn_unreachable = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["jupyterhub.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
preview = true
explicit-preview-rules = true
extend-select = ["fallible-context-manager", "noqa-comments", "rule-codes-in-selectors"]
ignore = [
    "missing-trailing-comma",
    "missing-copyright-notice",
    "D",
    "DOC",
    "line-too-long",
    "EM",
    "FBT",
    "single-line-implicit-string-concatenation",
    "complex-structure",
    "too-many-return-statements",
    "too-many-branches",
    "too-many-arguments",
    "too-many-locals",
    "too-many-statements",
    "magic-value-comparison",
    "too-many-statements-in-try-clause",
    "unnecessary-assign",
    "ambiguous-unicode-character-string",
    "unused-async",
    "TC",
    "raise-vanilla-args",
]

[tool.ruff.lint.per-file-ignores]
"jupyterhub_config.py" = ["hardcoded-temp-file"]
"../scripts/tests/**" = [
    "ANN401",
    "ARG001",
    "ARG002",
    "B023",
    "PLC0415",
    "PT009",
    "PT027",
    "RUF105",
    "SIM117",
    "SLF001",
]
"tests/**" = [
    "ANN",
    "ARG",
    "async-function-with-timeout",
    "blocking-path-method-in-async-function",
    "hardcoded-password-func-arg",
    "hardcoded-password-string",
    "implicit-namespace-package",
    "import-private-name",
    "no-self-use",
    "noqa-comments",
    "assert",
    "private-member-access",
    "print",
    "unused-noqa",
]

[tool.ruff.format]
docstring-code-format = true
